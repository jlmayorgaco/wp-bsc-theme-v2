name: Validar PHP del tema

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-lint:
    name: Sintaxis PHP 8.3
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validar los archivos PHP versionados
        shell: bash
        run: |
          php8.3 --version
          failed=0
          while IFS= read -r -d '' file; do
            if ! result=$(php8.3 -n -l "./$file" 2>&1); then
              printf '%s\n' "$result"
              failed=1
            fi
          done < <(git ls-files -z -- '*.php')
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo 'La sintaxis de los archivos PHP es válida.'
