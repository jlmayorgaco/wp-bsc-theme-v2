name: Verificar deploy en produccion

# El webhook de GitHub dispara el deploy (cicd/deploy.php). Este workflow no
# despliega: comprueba que produccion quedo realmente en el commit que se empujo.
# Si el deploy no corrio, fallo o hizo rollback, este check queda en rojo y
# GitHub avisa por correo, sin necesidad de entrar al VPS.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-deploy
  cancel-in-progress: true

jobs:
  verify:
    name: Produccion esta en este commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: https://bubblesskincare.com

    steps:
      - name: Esperar a que produccion reporte este commit
        run: |
          echo "Commit esperado: $GITHUB_SHA"
          live=""
          for attempt in $(seq 1 36); do
            live=$(curl -fsS --max-time 10 "$SITE/deploy-version.txt?cb=$GITHUB_RUN_ID-$attempt" 2>/dev/null | tr -d '[:space:]' || true)

            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "OK: produccion esta en $live (intento $attempt, ~$((attempt * 5))s)"
              exit 0
            fi

            # Bootstrap: the previous deploy.php did not publish this file.
            # Confirm the first hotfix by its no-cache response contract.
            if [ -z "$live" ]; then
              curl -fsS --max-time 20 -o /dev/null "$SITE/purge/" || true
              headers=$(mktemp)
              status=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/?cb=$GITHUB_RUN_ID-$attempt" || true)

              if echo "$status" | grep -Eq '^[23]' && grep -Eiq '^cache-control:.*(no-store|no-cache)' "$headers"; then
                echo "::notice::Primer deploy verificado por el nuevo contrato no-cache."
                exit 0
              fi

              rm -f "$headers"
            fi

            echo "intento $attempt/36 - produccion reporta: ${live:-<sin respuesta>}"
            sleep 5
          done

          echo "::error::Produccion reporta '${live:-<sin respuesta>}' y se esperaba $GITHUB_SHA."
          echo "Revisa Settings > Webhooks > Recent Deliveries, o /var/www/bsc-deploy.log en el VPS."
          exit 1

      - name: Purgar cache HTML anterior
        run: |
          curl -fsS --max-time 20 -o /dev/null "$SITE/purge/"

      - name: La tienda responde
        run: |
          for page in "/" "/shop/" "/cart/"; do
            headers=$(mktemp)
            status=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' --max-time 20 "$SITE$page?cb=$GITHUB_RUN_ID")
            echo "$page -> $status"

            case "$status" in
              2*|3*) ;;
              *) echo "::error::$page respondio $status"; exit 1 ;;
            esac

            if ! grep -Eiq '^cache-control:.*(no-store|no-cache)' "$headers"; then
              echo "::error::$page no envio Cache-Control no-store/no-cache"
              cat "$headers"
              exit 1
            fi
          done
