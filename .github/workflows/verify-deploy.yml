name: Verificar deploy en produccion

# El webhook de GitHub dispara el deploy (cicd/deploy.php). Este workflow no
# despliega: comprueba que produccion quedo realmente en el commit que se empujo.
# Si el deploy no corrio, fallo o hizo rollback, este check queda en rojo y
# GitHub avisa por correo, sin necesidad de entrar al VPS.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-deploy
  cancel-in-progress: true

jobs:
  verify:
    name: Produccion esta en este commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: https://bubblesskincare.com

    steps:
      - name: Esperar a que produccion reporte este commit
        run: |
          echo "Commit esperado: $GITHUB_SHA"
          live=""
          for attempt in $(seq 1 36); do
            if response=$(curl -fsS --max-time 10 "$SITE/deploy-version.txt?cb=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt"); then
              live=$(printf '%s' "$response" | tr -d '\r\n')
            else
              live=""
            fi

            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "OK: produccion esta en $live (intento $attempt, ~$((attempt * 5))s)"
              exit 0
            fi

            if ! [[ "$live" =~ ^[a-f0-9]{40}$ ]]; then
              live=""
            fi

            echo "intento $attempt/36 - produccion reporta: ${live:-<sin respuesta>}"
            sleep 5
          done

          echo "::error::Produccion reporta '${live:-<sin respuesta>}' y se esperaba $GITHUB_SHA."
          echo "Revisa Settings > Webhooks > Recent Deliveries, o /var/www/bsc-deploy.log en el VPS."
          exit 1

      - name: Purgar cache HTML anterior
        run: |
          status=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$SITE/purge/" || true)
          echo "/purge/ -> $status"

          case "$status" in
            2*|3*|412) ;;
            *) echo "::warning::La purga HTTP no estuvo disponible; se validaran igualmente las cabeceras no-cache." ;;
          esac

      - name: La tienda responde y respeta cache selectivo
        run: |
          for page in "/" "/shop/"; do
            headers=$(mktemp)
            status=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' --max-time 20 "$SITE$page?cb=$GITHUB_RUN_ID")
            echo "$page -> $status"

            case "$status" in
              2*|3*) ;;
              *) echo "::error::$page respondio $status"; exit 1 ;;
            esac

            if ! grep -Eiq '^cache-control:.*public' "$headers"; then
              echo "::error::$page no envio Cache-Control public para cache de visitante anonimo"
              cat "$headers"
              exit 1
            fi
          done

          for page in "/cart/" "/checkout/"; do
            headers=$(mktemp)
            status=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' --max-time 20 "$SITE$page?cb=$GITHUB_RUN_ID")
            echo "$page -> $status"
            case "$status" in
              2*|3*) ;;
              *) echo "::error::$page respondio $status"; exit 1 ;;
            esac
            if ! grep -Eiq '^cache-control:.*(private|no-store|no-cache)' "$headers"; then
              echo "::error::$page no envio Cache-Control privado/no-cache"
              cat "$headers"
              exit 1
            fi
          done
